# ===================================================================
# AI Mock Interview Platform - Developer Example Configuration
# Copy this file or set corresponding environment variables.
# ===================================================================

# Server
server.port=8080

# Database (SQL Server Local / Express Example)
# JDBC URL format: jdbc:sqlserver://localhost:1433;databaseName=aimockinterview;encrypt=true;trustServerCertificate=true;
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=aimockinterview;encrypt=true;trustServerCertificate=true;
spring.datasource.username=YOUR_SQLSERVER_USERNAME
spring.datasource.password=YOUR_SQLSERVER_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# JWT (Base64-encoded secret key or a 256-bit+ secure random phrase)
app.jwt.secret=YOUR_BASE64_ENCODED_256_BIT_SECRET_KEY_GOES_HERE_MIN_32_BYTES
app.jwt.expiration-ms=86400000

# Gemini AI (Get key from https://aistudio.google.com/)
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.model=gemini-3.6-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.connect-timeout-ms=10000
gemini.read-timeout-ms=30000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
