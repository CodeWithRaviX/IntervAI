# ===================================================================
# AI Mock Interview Platform - Developer Example Configuration
# Copy this file or set corresponding environment variables.
# ===================================================================

# Server
server.port=8080

# Database (PostgreSQL / Neon Cloud Database Example)
# JDBC URL format: jdbc:postgresql://<host>:5432/<database>?sslmode=require
spring.datasource.url=jdbc:postgresql://localhost:5432/neondb
spring.datasource.username=YOUR_POSTGRES_USERNAME
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (Base64-encoded secret key or a 256-bit+ secure random phrase)
app.jwt.secret=YOUR_BASE64_ENCODED_256_BIT_SECRET_KEY_GOES_HERE_MIN_32_BYTES
app.jwt.expiration-ms=86400000

# Gemini AI (Get key from https://aistudio.google.com/)
gemini.api.key=YOUR_GEMINI_API_KEY
gemini.model=gemini-3.6-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.connect-timeout-ms=10000
gemini.read-timeout-ms=30000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
