# ===================================================================
# AI Mock Interview Platform - Main Configuration Template
# NOTE: DO NOT commit actual secrets or credentials to this file.
# Supply environment variables or use external config in production.
# ===================================================================

# Spring Config Import for optional local secrets
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=

# Microsoft SQL Server Database Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AI_Mock_Interview;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:springuser}
spring.datasource.password=${DB_PASSWORD:YOUR_DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Spring Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:7fK9#mQ2$vL8@xP4!nR6^zT1&cW5*eY9+uA3DWDTedhg}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google Gemini AI Integration Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.connect-timeout-ms=10000
gemini.read-timeout-ms=30000

# CORS Configuration (Comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# File Upload Configuration (for Resume Processing)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.root=INFO
logging.level.com.aimock.interview=DEBUG
logging.level.org.springframework.security=INFO
