version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aimock-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YOUR_STRONG_PASSWORD_HERE
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: aimock-backend
    environment:
      - DB_URL=jdbc:sqlserver://sqlserver:1433;databaseName=aimockinterview;encrypt=true;trustServerCertificate=true;
      - DB_USERNAME=sa
      - DB_PASSWORD=YOUR_STRONG_PASSWORD_HERE
      - JWT_SECRET=YOUR_BASE64_JWT_SECRET_KEY
      - GEMINI_API_KEY=YOUR_GEMINI_API_KEY
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: aimock-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mssql_data: